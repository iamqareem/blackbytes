<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Snapfeed">
  <defs>
    <linearGradient id="leaf" x1="140" y1="380" x2="390" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00A6C2"/>
      <stop offset="1" stop-color="#5CF3FF"/>
    </linearGradient>
    <radialGradient id="bg" cx="35%" cy="28%" r="85%">
      <stop offset="0" stop-color="#111A22"/>
      <stop offset="1" stop-color="#080B0F"/>
    </radialGradient>
  </defs>

  <!-- full-bleed rounded square (Telegram app icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none"
        stroke="#2BE8FF" stroke-opacity="0.16" stroke-width="6"/>

  <!-- dew drop (balance, upper-left) -->
  <circle cx="150" cy="152" r="20" fill="#2BE8FF" fill-opacity="0.9"/>

  <!-- leaf -->
  <path d="M160 368 C164 260 250 160 376 136 C352 264 272 348 160 368 Z" fill="url(#leaf)"/>
  <!-- vein -->
  <path d="M186 348 Q262 272 352 168" fill="none" stroke="#0A0E13" stroke-opacity="0.75"
        stroke-width="16" stroke-linecap="round"/>
  <!-- sprout stem -->
  <path d="M120 420 Q148 396 160 368" fill="none" stroke="#5CF3FF" stroke-width="18" stroke-linecap="round"/>
</svg>
