<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Snapfeed</title>
    <link rel="stylesheet" href="/style.css">
    <script>
        (() => {
            const saved = localStorage.getItem('snapfeed_theme');
            if (saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</head>
<body class="bg-black text-white min-h-screen font-sans antialiased overflow-hidden">

    <!-- Debug overlay -->
    <div id="debug" class="fixed top-4 left-4 z-50 p-3 bg-red-900/80 text-white text-xs rounded border border-red-500/30 hidden">
        <div id="debug-title" class="font-bold mb-1">DIAGNOSTIC</div>
        <div id="debug-content" class="space-y-1"></div>
    </div>

    <div id="log" class="fixed bottom-4 left-4 z-50 p-3 bg-black/80 text-green-400 text-xs rounded border border-green-500/30 hidden">
        <div id="log-content" class="space-y-1 font-mono"></div>
    </div>

    <header class="fixed top-0 left-0 right-0 h-14 px-4 flex items-center justify-between z-40 bg-black/80 backdrop-blur border-b border-white/10">
        <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/'">
            <div class="w-6 h-6 rounded-full bg-blue-500 flex items-center justify-center text-white text-xs font-bold">S</div>
            <span class="font-bold text-lg tracking-tight">Snapfeed</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="theme-toggle" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-colors" aria-label="Toggle theme">
                🌙
            </button>
            <button id="prefs-btn" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-colors" aria-label="Preferences">
                ⚙️
            </button>
        </div>
    </header>

    <main class="pt-16 pb-24 px-2 overflow-y-auto h-[100svh] -mx-2" id="feed" role="main">
        <div class="flex flex-col items-center justify-center h-full">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mb-4"></div>
            <p class="text-white/60">Loading feed...</p>
            <p id="status-msg" class="text-white/40 text-sm mt-2">Initializing...</p>
        </div>
    </main>

    <div id="action-bar" class="fixed left-2 bottom-[calc(100px+env(safe-area-inset-bottom))] z-50 flex gap-2 p-2 bg-black/80 backdrop-blur-md border border-white/10 rounded-full pointer-events-auto transition-all duration-300">
        <button id="btn-like" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20" aria-label="Like">❤️</button>
        <button id="btn-save" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20" aria-label="Save">🔖</button>
        <button id="btn-share" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20" aria-label="Share">↗️</button>
    </div>

    <button id="emoji-trigger" class="fixed right-2 bottom-[calc(100px+env(safe-area-inset-bottom))] z-50 w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white text-xl hover:bg-white/20" aria-label="Reactions">😊</button>

    <div id="emoji-picker" class="hidden fixed right-2 bottom-[calc(116px+env(safe-area-inset-bottom))] z-50 w-64 p-2 bg-black/90 backdrop-blur-md border border-white/10 rounded-xl shadow-2xl flex-wrap gap-2">
        😀😃😄😁😆😅😂🤣😊😇🙂🙃😉😌😍🥰😘😗😙😚😋😛😜🤪😝🤨🧐🤓😎🥸🤩🥳😏😒😞😔😟😕🙁😮😯😲😳😨😰😥😢😭😱😖😣😞😓😩😫🥱😤😡😠🤬😈👿💀💩🤡👹👺🤡👻👽🤖🎃😺😸😹😻😼😽🙀😿😾
    </div>

    <div id="prefs-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-black/95 rounded-2xl border border-white/10 p-6 w-full max-w-md">
            <h2 class="text-xl font-bold mb-4">Preferences</h2>
            <p class="text-sm text-white/60 mb-6">Select your favorite categories</p>
            <div id="prefs-chips" class="flex flex-wrap gap-2 mb-6"></div>
            <div class="flex justify-end gap-2">
                <button id="prefs-close" class="px-4 py-2 text-white/60 hover:text-white">Cancel</button>
                <button id="prefs-save" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Save</button>
            </div>
        </div>
    </div>

    <script>
        // ── Debug helpers ──
        const debugEl = document.getElementById('debug');
        const debugContent = document.getElementById('debug-content');
        const logEl = document.getElementById('log');
        const logContent = document.getElementById('log-content');
        const statusMsg = document.getElementById('status-msg');

        function debug(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            debugContent.appendChild(div);
            console.log('[DEBUG]', msg);
        }
        function log(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            logContent.appendChild(div);
            console.log('[LOG]', msg);
        }
        function showDebug() {
            debugEl.classList.remove('hidden');
            logEl.classList.remove('hidden');
        }
        function setStatus(msg) {
            if (statusMsg) statusMsg.textContent = msg;
            log(msg);
        }

        // ── Config ──
        const WORKER_URL = 'https://wrangler-auth.abdukarrim6.workers.dev';
        debug('Worker URL: ' + WORKER_URL);

        // ── State ──
        let posts = [];
        let ranked = [];
        let activeIndex = 0;
        let favorites = JSON.parse(localStorage.getItem('snapfeed_favorites') || '[]');
        let viewed = new Set(JSON.parse(localStorage.getItem('snapfeed_viewed') || '[]'));
        let interactions = {};
        let theme = localStorage.getItem('snapfeed_theme') || 'dark';
        let isTelegram = false;
        let isAdFree = false;

        // ── DOM ──
        const feed = document.getElementById('feed');
        const themeToggle = document.getElementById('theme-toggle');

        // ── Init ──
        function init() {
            debug('init() called');
            applyTheme();
            setupEventListeners();
            fetchAndRender();
        }

        function applyTheme() {
            if (theme === 'light') {
                document.documentElement.classList.add('light');
                themeToggle.textContent = '☀️';
            } else {
                document.documentElement.classList.remove('light');
                themeToggle.textContent = '🌙';
            }
            debug('Theme set to: ' + theme);
        }

        function setupEventListeners() {
            themeToggle.addEventListener('click', () => {
                theme = theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('snapfeed_theme', theme);
                applyTheme();
            });
        }

        // ── Data ──
        async function fetchAndRender() {
            try {
                setStatus('Fetching from Worker...');
                const posts = await fetchFromTurso();
                debug('Posts received: ' + posts.length);
                setStatus('Ranking ' + posts.length + ' posts...');
                ranked = rankAndFilter(posts);
                debug('Ranked posts: ' + ranked.length);
                if (ranked.length === 0) {
                    setStatus('No posts in feed (may be older than 3 days)');
                    feed.innerHTML = '<div class="text-center py-20 text-white/40">No recent posts (older than 3 days are hidden)</div>';
                    return;
                }
                renderCard(0);
                setStatus('Ready - ' + ranked.length + ' posts');
            } catch (err) {
                debug('ERROR: ' + err.message);
                setStatus('ERROR: ' + err.message);
                feed.innerHTML = '<div class="text-center py-20 text-red-400">Error: ' + escapeHtml(err.message) + '</div>';
                showDebug();
            }
        }

        async function fetchFromTurso() {
            const res = await fetch(`${WORKER_URL}/api/posts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    statements: [
                        `SELECT id, title, summary, media_url, media_type, source_url, source_name, category, likes, shares, saves, views, created_at, indexed_at FROM posts ORDER BY indexed_at DESC LIMIT 100;`
                    ]
                }),
            });
            debug('Worker response status: ' + res.status);
            if (!res.ok) throw new Error('Worker HTTP ' + res.status + ' - ' + await res.text());
            const data = await res.json();
            return (data.results?.[0]?.rows || []).map(row => ({
                id: row[0], title: row[1], summary: row[2], media_url: row[3],
                media_type: row[4], source_url: row[5], source_name: row[6],
                category: row[7], likes: row[8], shares: row[9], saves: row[10],
                views: row[11], created_at: row[12], indexed_at: row[13]
            }));
        }

        function rankAndFilter(items) {
            const now = new Date();
            const FRESHNESS_WINDOW_DAYS = 3;
            const FRESH_WEIGHT = 30;
            const FRESH_DECAY = 1.5;
            const VIDEO_TYPES = new Set(['shorts', 'embed', 'video']);
            const CATEGORY_BOOST = { Memes: 6.0, Entertainment: 2.0 };
            const SOURCE_CAP = 3;
            const CATEGORY_CAP = 6;
            const DIVERSITY_WINDOW = 25;

            const scored = items.map(post => {
                const postTime = new Date(post.created_at);
                const ageDays = isNaN(postTime) ? 0 : Math.max(0, (now - postTime) / 86400000);
                if (ageDays > FRESHNESS_WINDOW_DAYS) return null;
                const engagement = (post.likes||0)*1 + (post.shares||0)*2 + (post.saves||0)*3 + (post.views||0)*0.0001;
                const recency = FRESH_WEIGHT * Math.exp(-FRESH_DECAY * ageDays);
                const score = engagement + recency + (CATEGORY_BOOST[post.category] || 0);
                return { ...post, score };
            }).filter(Boolean);

            scored.sort((a, b) => b.score - a.score);

            if (favorites.length) {
                scored = scored.filter(p => favorites.includes(p.category));
            }

            const window = scored.slice(0, DIVERSITY_WINDOW);
            const tail = scored.slice(DIVERSITY_WINDOW);
            const kept = [], dropped = [];
            const srcCounts = {};
            for (const item of window) {
                if ((srcCounts[item.source_name] || 0) < SOURCE_CAP) {
                    kept.push(item);
                    srcCounts[item.source_name] = (srcCounts[item.source_name] || 0) + 1;
                } else {
                    dropped.push(item);
                }
            }

            if (favorites.length) {
                const catKept = [], catDropped = [];
                const catCounts = {};
                for (const item of kept) {
                    if ((catCounts[item.category] || 0) < CATEGORY_CAP) {
                        catKept.push(item);
                        catCounts[item.category] = (catCounts[item.category] || 0) + 1;
                    } else {
                        catDropped.push(item);
                    }
                }
                return interleaveVideos([...catKept, ...catDropped, ...dropped, ...tail]);
            }

            return interleaveVideos([...kept, ...dropped, ...tail]);
        }

        function interleaveVideos(items) {
            const VIDEO_TYPES = new Set(['shorts', 'embed', 'video']);
            const videos = items.filter(i => VIDEO_TYPES.has(i.media_type));
            if (!videos.length) return items;
            const others = items.filter(i => !VIDEO_TYPES.has(i.media_type));
            const out = [];
            let vi = 0;
            for (let pos = 0; pos < items.length; pos++) {
                const target = Math.floor(((pos + 1) * videos.length) / items.length);
                if (vi < videos.length && target > vi) {
                    out.push(videos[vi]);
                    vi++;
                } else if (others.length) {
                    out.push(others.shift());
                }
            }
            while (vi < videos.length) { out.push(videos[vi]); vi++; }
            return out;
        }

        function renderCard(index) {
            if (index < 0 || index >= ranked.length) {
                feed.innerHTML = '<div class="text-center py-20 text-white/40">No more content</div>';
                return;
            }
            const post = ranked[index];
            const isVideo = ['shorts', 'embed', 'video'].includes(post.media_type);
            const viewedCls = viewed.has(String(post.id)) ? 'opacity-50' : '';

            const mediaHtml = isVideo
                ? `<iframe class="w-full aspect-video rounded-lg" src="${escapeHtml(post.media_url)}" frameborder="0" allowfullscreen></iframe>`
                : `<img class="w-full h-72 object-cover rounded-lg" src="${escapeHtml(post.media_url || 'https://via.placeholder.com/400x300?text=No+Image')}" alt="${escapeHtml(post.title)}">`;

            const summaryHtml = post.summary ? `<p class="text-sm text-white/60 mt-2 line-clamp-3">${escapeHtml(post.summary)}</p>` : '';

            feed.innerHTML = `
                <article class="max-w-[400px] mx-auto flex flex-col gap-3 ${viewedCls}">
                    <div class="${isVideo ? 'aspect-video' : 'aspect-[4/3]'} rounded-lg bg-surface overflow-hidden relative">
                        ${mediaHtml}
                    </div>
                    <div class="flex items-center justify-between gap-2 mb-1">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400">${escapeHtml(post.source_name)}</span>
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-blue-900/30 text-blue-400 border border-blue-500/30">${escapeHtml(post.category)}</span>
                    </div>
                    <h2 class="text-xl font-bold leading-tight mb-2">${escapeHtml(post.title)}</h2>
                    ${summaryHtml}
                    <div class="mt-4 flex items-center justify-between">
                        <a href="${escapeHtml(post.source_url)}" target="_blank" rel="noopener" class="text-xs text-blue-400 underline hover:text-blue-300">Read on ${escapeHtml(post.source_name)}</a>
                    </div>
                </article>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ── Swipe ──
        let touchStartX = 0, touchStartY = 0;
        feed.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        feed.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 50) {
                if (diffY > 0 && activeIndex > 0) {
                    activeIndex--;
                } else if (diffY < 0 && activeIndex < ranked.length - 1) {
                    activeIndex++;
                }
                renderCard(activeIndex);
            }
        }, { passive: true });

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowDown' && activeIndex < ranked.length - 1) {
                activeIndex++;
                renderCard(activeIndex);
            }
            if (e.key === 'ArrowUp' && activeIndex > 0) {
                activeIndex--;
                renderCard(activeIndex);
            }
        });

        // ── Boot ──
        init();
    </script>
</body>
</html>
