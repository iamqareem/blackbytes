<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Snapfeed - Your daily dose of Afrocentric memes, culture &amp; tech">
    <title>Snapfeed</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

    <!-- Self-contained CSS (no external CDN) -->
    <link rel="stylesheet" href="/style.css">

    <!-- Theme toggle (runs before body renders) -->
    <script>
        (() => {
            const saved = localStorage.getItem('snapfeed_theme');
            if (saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</head>
<body class="bg-black text-white min-h-screen font-sans antialiased overflow-hidden">

        <span id="tg-banner-text">Open in Telegram for the full Mini App experience</span>
        <button id="tg-banner-close" class="ml-2 text-xs underline hover:text-blue-200">Dismiss</button>
    </div>

    <!-- Telegram Stars / premium upsell (Telegram context only) -->

        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
        <span id="tg-premium-text">Go ad-free with Telegram Stars</span>
        <button id="tg-premium-btn" class="ml-auto px-3 py-1 bg-amber-500 text-amber-900 text-xs font-bold rounded hover:bg-amber-400">Stars</button>

    <!-- Header -->

        <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/'">
            <div class="w-6 h-6 rounded-full bg-blue-500 flex items-center justify-center text-white text-xs font-bold">S</div>
            <span class="font-bold text-lg tracking-tight">Snapfeed</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="theme-toggle" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-colors" aria-label="Toggle theme">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 3c4.971 0 9.023 4.001 9.018 8.997.003.487-.035.965-.102 1.43a9 9 0 01-2.534 2.534c-.465.067-.944.105-1.43.102a9 9 0 01-8.997 9.018 9 9 0 01-8.997-8.996c0-4.971 4.001-9.023 8.997-9.018.487.067.965.102 1.43.102z"></path></svg>
            </button>
            <button id="prefs-btn" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-colors" aria-label="Preferences">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573z"></path></svg>

    <!-- Feed -->
    <main class="pt-16 pb-24 px-2 overflow-y-auto h-[100svh] -mx-2" id="feed" role="main" aria-label="Flashcard feed">

    <!-- Bottom action pill (hidden while swiping, reappears on tap) -->

    <!-- Ad template (cloned every 5th card) -->

                <div id="ad-content" class="w-full h-full flex items-center justify-center"></div>

    <script type="module">
        import { rankPosts } from './ranking.js';

        // ── Config ──
        // Worker proxy URL — deploy the Worker and set this to its URL
        const WORKER_URL = 'https://wrangler-auth.abdukarrim6.workers.dev';

        // ── Ad / Monetization config (from Turso site_config, cached in localStorage) ──
        let adConfig = {
            enable_ads: false,
            adsense_client_id: '',
            adsense_slot_feed: '',
            monetag_zone_id: '',
            affiliate_aliexpress: false,
            affiliate_aliexpress_tag: '',
        };

        // ── State ──
        let posts = [];
        let ranked = [];
        let activeIndex = 0;
        let favorites = JSON.parse(localStorage.getItem('snapfeed_favorites') || '[]');
        let viewed = new Set(JSON.parse(localStorage.getItem('snapfeed_viewed') || '[]'));
        let interactions = {}; // { [postId]: { like, save, share } }
        let theme = localStorage.getItem('snapfeed_theme') || 'dark';
        let isTelegram = false;
        let isAdFree = false;

        // ── DOM ──
        const feed = document.getElementById('feed');
        const themeToggle = document.getElementById('theme-toggle');
        const prefsBtn = document.getElementById('prefs-btn');
        const prefsModal = document.getElementById('prefs-modal');
        const prefsClose = document.getElementById('prefs-close');
        const prefsSave = document.getElementById('prefs-save');
        const prefsChips = document.getElementById('prefs-chips');
        const actionBar = document.getElementById('action-bar');
        const emojiTrigger = document.getElementById('emoji-trigger');
        const emojiPicker = document.getElementById('emoji-picker');
        const toastEl = document.getElementById('toast');
        const tgBanner = document.getElementById('tg-banner');
        const tgPremium = document.getElementById('tg-premium');
        const tgPremiumBtn = document.getElementById('tg-premium-btn');

        // ── Init ──
        function init() {
            applyTheme();
            detectTelegram();
            setupEventListeners();
            fetchAndRender();
        }

        function applyTheme() {
            if (theme === 'light') {
                document.documentElement.classList.add('light');
                themeToggle.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 008 0z"></path></svg>';
            } else {
                document.documentElement.classList.remove('light');
                themeToggle.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 3c4.971 0 9.023 4.001 9.018 8.997.003.487-.035.965-.102 1.43a9 9 0 01-2.534 2.534c-.465.067-.944.105-1.43.102a9 9 0 01-8.997 9.018 9 9 0 01-8.997-8.996c0-4.971 4.001-9.023 8.997-9.018.487.067.965.102 1.43.102z"></path></svg>';
            }
        }

        function detectTelegram() {
            isTelegram = !!window.Telegram?.WebApp;
            if (isTelegram) {
                tgBanner.classList.remove('hidden');
                if (window.Telegram.WebApp) {
                    Telegram.WebApp.ready();
                    Telegram.WebApp.expand();
                    Telegram.WebApp.MainButton.text = 'Go Ad-Free (Stars)';
                    Telegram.WebApp.MainButton.onClick(() => {
                        if (Telegram.WebApp.openInvoice) {
                            Telegram.WebApp.openInvoice({
                                title: 'Snapfeed Ad-Free',
                                description: 'Remove ads for 30 days',
                                payload: 'snapfeed_adfree_30d',
                                provider_token: '',
                                currency: 'XTR',
                                prices: [{ label: 'Ad-Free 30 Days', amount: 99 }],
                            });
                        }
                    });
                }
                if (!isAdFree) {
                    tgPremium.classList.remove('hidden');
                    actionBar.style.transform = 'translateY(10px)';
                    actionBar.style.opacity = '0.5';
                }
            }
        }

        function setupEventListeners() {
            themeToggle.addEventListener('click', () => {
                theme = theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('snapfeed_theme', theme);
                applyTheme();
            });

            prefsBtn.addEventListener('click', () => {
                prefsModal.classList.remove('hidden');
                renderPrefsChips();
            });

            prefsClose.addEventListener('click', () => prefsModal.classList.add('hidden'));
            prefsSave.addEventListener('click', () => {
                prefsModal.classList.add('hidden');
                fetchAndRender();
            });

            tgPremiumBtn.addEventListener('click', () => {
                if (Telegram.WebApp.openInvoice) {
                    Telegram.WebApp.openInvoice({
                        title: 'Snapfeed Ad-Free',
                        description: 'Remove ads for 30 days',
                        payload: 'snapfeed_adfree_30d',
                        provider_token: '',
                        currency: 'XTR',
                        prices: [{ label: 'Ad-Free 30 Days', amount: 99 }],
                    });
                }
            });

            // HUD tuck on scroll
            feed.addEventListener('scroll', () => {
                actionBar.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
                emojiTrigger.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
                emojiPicker.classList.add('hidden');
            }, { passive: true });

            // Tap to toggle HUD
            feed.addEventListener('click', (e) => {
                if (e.target.closest('button, a')) return;
                const tucked = actionBar.classList.contains('opacity-0');
                actionBar.classList.toggle('opacity-0');
                actionBar.classList.toggle('translate-y-2');
                actionBar.classList.toggle('pointer-events-none');
                emojiTrigger.classList.toggle('opacity-0');
                emojiTrigger.classList.toggle('translate-y-2');
                emojiTrigger.classList.toggle('pointer-events-none');
            });

            // Action buttons
            document.getElementById('btn-like').addEventListener('click', () => toggleInteraction('like'));
            document.getElementById('btn-save').addEventListener('click', () => toggleInteraction('save'));
            document.getElementById('btn-share').addEventListener('click', () => toggleInteraction('share'));

            // Emoji trigger
            emojiTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                emojiPicker.classList.toggle('hidden');
            });

            // Close picker on outside click
            document.addEventListener('click', (e) => {
                if (!emojiTrigger.contains(e.target) && !emojiPicker.contains(e.target)) {
                    emojiPicker.classList.add('hidden');
                }
            });
        }

        // ── Data ──
        async function fetchAndRender() {
            try {
                const [raw, config] = await Promise.all([fetchFromTurso(), fetchConfigFromTurso()]);
                posts = raw;
                adConfig = config;
                isAdFree = localStorage.getItem('snapfeed_adfree') === 'true' || (isTelegram && adConfig.enable_ads === false);
                ranked = rankAndFilter(posts);
                renderCard(activeIndex);
            } catch (err) {
                console.error('Fetch failed:', err);
                showToast('Failed to load feed');
            }
        }

        async function fetchFromTurso() {
            const res = await fetch(`${WORKER_URL}/api/posts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    statements: [
                        `SELECT id, title, summary, media_url, media_type, source_url, source_name, category, likes, shares, saves, views, created_at, indexed_at FROM posts ORDER BY indexed_at DESC LIMIT 100;`
                    ]
                }),
            });
            if (!res.ok) throw new Error(`Worker HTTP ${res.status}`);
            const data = await res.json();
            return (data.results?.[0]?.rows || []).map(row => ({
                id: row[0], title: row[1], summary: row[2], media_url: row[3],
                media_type: row[4], source_url: row[5], source_name: row[6],
                category: row[7], likes: row[8], shares: row[9], saves: row[10],
                views: row[11], created_at: row[12], indexed_at: row[13]
            }));
        }

        async function fetchConfigFromTurso() {
            try {
                const res = await fetch(`${WORKER_URL}/api/posts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        statements: [`SELECT key, value FROM site_config;`]
                    }),
                });
                if (!res.ok) return adConfig;
                const data = await res.json();
                const rows = data.results?.[0]?.rows || [];
                const cfg = { ...adConfig };
                rows.forEach(([key, value]) => {
                    if (key in cfg) cfg[key] = value === 'true' ? true : value;
                });
                localStorage.setItem('snapfeed_adconfig', JSON.stringify(cfg));
                return cfg;
            } catch (e) {
                const cached = localStorage.getItem('snapfeed_adconfig');
                return cached ? JSON.parse(cached) : adConfig;
            }
        }

        function rankAndFilter(items) {
            const now = new Date();
            const FRESHNESS_WINDOW_DAYS = 3;
            const FRESH_WEIGHT = 30;
            const FRESH_DECAY = 1.5;
            const VIDEO_TYPES = new Set(['shorts', 'embed', 'video']);
            const CATEGORY_BOOST = { Memes: 6.0, Entertainment: 2.0 };
            const SOURCE_CAP = 3;
            const CATEGORY_CAP = 6;
            const DIVERSITY_WINDOW = 25;

            const scored = items.map(post => {
                const postTime = new Date(post.created_at);
                const ageDays = isNaN(postTime) ? 0 : Math.max(0, (now - postTime) / 86400000);
                if (ageDays > FRESHNESS_WINDOW_DAYS) return null;
                const engagement = (post.likes||0)*1 + (post.shares||0)*2 + (post.saves||0)*3 + (post.views||0)*0.0001;
                const recency = FRESH_WEIGHT * Math.exp(-FRESH_DECAY * ageDays);
                const score = engagement + recency + (CATEGORY_BOOST[post.category] || 0);
                return { ...post, score };
            }).filter(Boolean);

            scored.sort((a, b) => b.score - a.score);

            // Category filter (favorites)
            if (favorites.length) {
                scored = scored.filter(p => favorites.includes(p.category));
            }

            // Diversity window: source cap
            const window = scored.slice(0, DIVERSITY_WINDOW);
            const tail = scored.slice(DIVERSITY_WINDOW);
            const kept = [], dropped = [];
            const srcCounts = {};
            for (const item of window) {
                if ((srcCounts[item.source_name] || 0) < SOURCE_CAP) {
                    kept.push(item);
                    srcCounts[item.source_name] = (srcCounts[item.source_name] || 0) + 1;
                } else {
                    dropped.push(item);
                }
            }

            // Category cap (favorites only)
            if (favorites.length) {
                const catKept = [], catDropped = [];
                const catCounts = {};
                for (const item of kept) {
                    if ((catCounts[item.category] || 0) < CATEGORY_CAP) {
                        catKept.push(item);
                        catCounts[item.category] = (catCounts[item.category] || 0) + 1;
                    } else {
                        catDropped.push(item);
                    }
                }
                return interleaveVideos([...catKept, ...catDropped, ...dropped, ...tail]);
            }

            return interleaveVideos([...kept, ...dropped, ...tail]);
        }

        function interleaveVideos(items) {
            const VIDEO_TYPES = new Set(['shorts', 'embed', 'video']);
            const videos = items.filter(i => VIDEO_TYPES.has(i.media_type));
            if (!videos.length) return items;
            const others = items.filter(i => !VIDEO_TYPES.has(i.media_type));
            const out = [];
            let vi = 0;
            for (let pos = 0; pos < items.length; pos++) {
                const target = Math.floor(((pos + 1) * videos.length) / items.length);
                if (vi < videos.length && target > vi) {
                    out.push(videos[vi]);
                    vi++;
                } else if (others.length) {
                    out.push(others.shift());
                }
            }
            while (vi < videos.length) { out.push(videos[vi]); vi++; }
            return out;
        }

        // ── Affiliate link rewriting ──
        function affiliateUrl(url) {
            if (!adConfig.affiliate_aliexpress || !adConfig.affiliate_aliexpress_tag) return url;
            try {
                const u = new URL(url);
                if (u.hostname.includes('aliexpress.com')) {
                    u.searchParams.set('aff_platform', 'mws');
                    u.searchParams.set('aff_ext_fingerprint', adConfig.affiliate_aliexpress_tag);
                    u.searchParams.set('aff_short_key', adConfig.affiliate_aliexpress_tag);
                    u.searchParams.set('utm_source', 'snapfeed');
                    u.searchParams.set('utm_medium', 'affiliate');
                    u.searchParams.set('utm_campaign', 'snapfeed_app');
                    return u.toString();
                }
            } catch (_) {}
            return url;
        }

        // ── Ad rendering ──
        function renderAdSlot() {
            if (!adConfig.enable_ads || isAdFree) return `<div class="my-4"></div>`;

            const adId = `snapfeed-ad-${Date.now()}`;
            const html = `
                <div class="flex justify-center my-4">
                    <div class="w-full max-w-[320px] h-[280px] border border-white/10 rounded-lg flex items-center justify-center text-white/40 text-xs relative overflow-hidden">
                        <div class="absolute top-1 left-1 text-[10px] text-white/40 bg-black/60 px-1 py-0.5 rounded">Ad</div>
                        <div id="${adId}" class="w-full h-full"></div>
                    </div>
                </div>
            `;

            // Try AdSense
            if (adConfig.adsense_client_id && adConfig.adsense_slot_feed && !isTelegram) {
                setTimeout(() => {
                    const el = document.getElementById(adId);
                    if (!el) return;
                    el.innerHTML = `
                        <ins class="adsbygoogle" style="display:inline-block;width:320px;height:280px"
                             data-ad-client="${escapeHtml(adConfig.adsense_client_id)}"
                             data-ad-slot="${escapeHtml(adConfig.adsense_slot_feed)}"></ins>
                    `;
                    if (window.adsbygoogle) window.adsbygoogle.push({});
                }, 100);
                return html;
            }

            // Try Monetag
            if (adConfig.monetag_zone_id) {
                setTimeout(() => {
                    const el = document.getElementById(adId);
                    if (!el) return;
                    el.innerHTML = `
                        <iframe src="https://www.monetag.com/serve/${escapeHtml(adConfig.monetag_zone_id)}"
                                width="320" height="280" style="border:0;" scrolling="no"></iframe>
                    `;
                }, 100);
                return html;
            }

            // Telegram Adsgram placeholder
            if (isTelegram && Telegram.WebApp) {
                setTimeout(() => {
                    const el = document.getElementById(adId);
                    if (!el) return;
                    el.innerHTML = `
                        <div class="w-full h-full bg-white/5 rounded flex items-center justify-center text-[10px] text-white/40 border border-white/10">
                            Sponsored
                        </div>
                    `;
                }, 100);
                return html;
            }

            return html;
        }

        // ── Render ──
        function renderCard(index) {
            if (index < 0 || index >= ranked.length) {
                feed.innerHTML = '<div class="text-center py-20 text-white/40">No more content</div>';
                return;
            }

            const post = ranked[index];
            const isVideo = ['shorts', 'embed', 'video'].includes(post.media_type);
            const viewedCls = viewed.has(String(post.id)) ? 'opacity-50' : '';

            const mediaHtml = isVideo
                ? `<iframe class="w-full aspect-video rounded-lg" src="${escapeHtml(post.media_url)}" frameborder="0" allowfullscreen></iframe>`
                : `<img class="w-full h-72 object-cover rounded-lg" src="${escapeHtml(post.media_url || 'https://via.placeholder.com/400x300?text=No+Image')}" alt="${escapeHtml(post.title)}">`;

            const summaryHtml = post.summary ? `<p class="text-sm text-white/60 mt-2 line-clamp-3">${escapeHtml(post.summary)}</p>` : '';

            const sourceUrl = affiliateUrl(post.source_url);

            feed.innerHTML = `
                <article class="max-w-[400px] mx-auto flex flex-col gap-3 ${viewedCls}">
                    <div class="${isVideo ? 'aspect-video' : 'aspect-[4/3]'} rounded-lg bg-surface overflow-hidden relative">
                        ${mediaHtml}
                    </div>
                    <div class="flex items-center justify-between gap-2 mb-1">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400">${escapeHtml(post.source_name)}</span>
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-blue-900/30 text-blue-400 border border-blue-500/30">${escapeHtml(post.category)}</span>
                    </div>
                    <h2 class="text-xl font-bold leading-tight mb-2">${escapeHtml(post.title)}</h2>
                    ${summaryHtml}
                    <div class="mt-4 flex items-center justify-between">
                        <a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener" class="text-xs text-blue-400 underline hover:text-blue-300">
                            Read on ${escapeHtml(post.source_name)}
                            ${adConfig.affiliate_aliexpress ? '<span class="text-[10px] ml-1">→</span>' : ''}
                        </a>
                    </div>
                </article>
                ${index % 5 === 4 ? renderAdSlot() : ''}
            `;

            updateActionCounts(post);
        }

        function updateActionCounts(post) {
            document.getElementById('count-like').textContent = post.likes;
            document.getElementById('count-save').textContent = post.saves;
            document.getElementById('count-share').textContent = post.shares;
        }

        function toggleInteraction(action) {
            const post = ranked[activeIndex];
            if (!post) return;
            const id = String(post.id);
            if (!interactions[id]) interactions[id] = {};

            interactions[id][action] = !interactions[id][action];
            if (action === 'like') post.likes += interactions[id].like ? 1 : -1;
            if (action === 'save') post.saves += interactions[id].save ? 1 : -1;
            if (action === 'share') post.shares += interactions[id].share ? 1 : -1;

            localStorage.setItem('snapfeed_interactions', JSON.stringify(interactions));
            ranked = rankAndFilter(posts);
            renderCard(Math.min(activeIndex, ranked.length - 1));
            showToast(action.charAt(0).toUpperCase() + action.slice(1) + (interactions[id][action] ? '' : 'd'));
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.remove('opacity-0');
            setTimeout(() => toastEl.classList.add('opacity-0'), 2000);
        }

        // ── Swipe navigation ──
        let touchStartX = 0, touchStartY = 0;
        feed.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        feed.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 50) {
                if (diffY > 0 && activeIndex > 0) {
                    activeIndex--;
                } else if (diffY < 0 && activeIndex < ranked.length - 1) {
                    activeIndex++;
                }
                renderCard(activeIndex);
            }
        }, { passive: true });

        // Keyboard nav
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowDown' && activeIndex < ranked.length - 1) {
                activeIndex++;
                renderCard(activeIndex);
            }
            if (e.key === 'ArrowUp' && activeIndex > 0) {
                activeIndex--;
                renderCard(activeIndex);
            }
        });

        // ── Preferences ──
        function renderPrefsChips() {
            const cats = ['News', 'Sports', 'Memes', 'Entertainment', 'Culture', 'Tech'];
            prefsChips.innerHTML = cats.map(cat => `
                <button class="px-3 py-1 rounded-full text-sm border transition-colors ${favorites.includes(cat) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white/10 text-white/60 border-white/10 hover:bg-white/20'}" data-cat="${cat}">
                    ${cat}
                </button>
            `).join('');
            prefsChips.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.dataset.cat;
                    if (favorites.includes(cat)) favorites = favorites.filter(c => c !== cat);
                    else favorites.push(cat);
                    renderPrefsChips();
                });
            });
        }

        // ── Boot ──
        init();
    </script>
</body>
</html>
