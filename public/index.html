<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Blackbytes - Your daily dose of Afrocentric memes, culture &amp; tech">
    
    <title>Blackbytes</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <link rel="mask-icon" href="/icons/icon.svg" color="#3B82F6">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="Blackbytes">
    <meta property="og:description" content="Your daily dose of Afrocentric memes, culture &amp; tech">
    <meta property="og:image" content="/icons/og-image.png">
    <meta property="og:url" content="https://gossip.ugaplex.com">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blackbytes">
    <meta name="twitter:description" content="Your daily dose of Afrocentric memes, culture &amp; tech">
    <meta name="twitter:image" content="/icons/og-image.png">
    <meta name="twitter:site" content="@blackbytes">

    <link rel="stylesheet" href="/dist/styles.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    <script type="module" src="/dist/app.js"></script>
</head>
<body>

    <!-- Transparent header — logo + theme toggle float over cards -->
    <header class="header" role="banner">
        <div class="header-inner">
            <a href="/" class="logo" aria-label="Blackbytes Home">
                <svg class="logo-icon" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ED4956;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="64" cy="64" r="64" fill="url(#logoGrad)"/>
                    <path d="M38 84 Q38 56 56 56 Q74 56 74 74 Q74 86 64 96 Q54 86 38 84 Z" fill="white" opacity="0.95"/>
                    <circle cx="48" cy="70" r="3.5" fill="#3B82F6" opacity="0.9"/>
                    <circle cx="64" cy="68" r="3.5" fill="#ED4956" opacity="0.9"/>
                    <circle cx="80" cy="70" r="3.5" fill="#F56040" opacity="0.9"/>
                    <polygon points="95,50 96.5,54 101,54 97.5,56.5 98.5,61 95,58.5 91.5,61 92.5,56.5 89,54 93.5,54" fill="#FFD700" opacity="0.9"/>
                </svg>
                <span class="logo-text">Blackbytes</span>
            </a>
            <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>
        </div>
    </header>

    <!-- Full-screen snap-scroll feed -->
    <main class="feed" id="feed" role="main" aria-label="Flashcard feed"></main>

    <!-- Loader overlay -->
    <div class="feed-loader" id="loader" aria-live="polite">
        <div class="spinner"></div>
    </div>

    <!-- Empty state -->
    <div class="empty-state hidden" id="empty-state">
        <svg class="empty-state-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <p class="empty-state-title">No content yet</p>
        <p class="empty-state-desc">Check back soon for fresh content</p>
    </div>

    <!-- Right-side action buttons (TikTok/Reels style) -->
    <nav class="action-bar" id="action-bar" role="navigation" aria-label="Post actions">
        <!-- Like -->
        <div class="action-btn-wrap">
            <button class="action-btn" data-action="like" aria-label="Like" title="Like">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </button>
            <span class="action-btn-count hidden" id="like-count">0</span>
        </div>

        <!-- Save -->
        <div class="action-btn-wrap">
            <button class="action-btn" data-action="save" aria-label="Save" title="Save">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
            </button>
            <span class="action-btn-count hidden" id="save-count">0</span>
        </div>

        <!-- Share -->
        <div class="action-btn-wrap">
            <button class="action-btn" data-action="share" aria-label="Share" title="Share">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
            </button>
            <span class="action-btn-count hidden" id="share-count">0</span>
        </div>

        <!-- Emoji reactions -->
        <div class="action-btn-wrap" style="position:relative;">
            <button id="emoji-trigger" class="emoji-trigger" aria-label="Reactions" aria-expanded="false" aria-haspopup="true" title="React">
                😊
            </button>
        </div>
    </nav>

    <!-- Emoji picker (global, positioned fixed) -->
    <div id="emoji-picker" class="emoji-picker" role="menu" aria-label="Choose reaction"></div>

    <!-- Progress dots -->
    <div class="progress-dots" id="progress-dots" aria-hidden="true"></div>

    <!-- Cookie banner -->
    <div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Cookie consent">
        <div class="cookie-content">
            <p class="cookie-text">We use cookies to personalise your feed. <a href="/privacy.html">Privacy Policy</a></p>
            <div class="cookie-actions">
                <button id="cookie-decline" class="btn btn-secondary btn-sm">Decline</button>
                <button id="cookie-accept" class="btn btn-primary btn-sm">Accept</button>
            </div>
        </div>
    </div>

</body>
</html>
